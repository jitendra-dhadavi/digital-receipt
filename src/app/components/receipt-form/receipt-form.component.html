<div class="receipt-container">
  <form [formGroup]="receiptForm" class="pos-layout">
    <!-- LEFT PANEL: ITEMS & INPUTS -->
    <div class="items-panel glass-card">
      <div class="panel-header">
        <h2>🛒 Cart Details</h2>
        <div class="cashier-info">
          <mat-form-field appearance="fill" class="compact-input">
            <mat-label>Cashier Name</mat-label>
            <mat-icon matPrefix>person</mat-icon>
            <input matInput formControlName="cashier" placeholder="John Doe" />
          </mat-form-field>
        </div>
      </div>

      <div class="items-list-container" formArrayName="items">
        @for (item of items.controls; track item; let i = $index) {
        <div [formGroupName]="i" class="item-row">
          <div class="item-index">#{{ i + 1 }}</div>

          <mat-form-field class="item-name wide">
            <mat-label>Item Name</mat-label>
            <input matInput formControlName="name" placeholder="Product..." />
          </mat-form-field>

          <mat-form-field class="item-price narrow">
            <mat-label>Price</mat-label>
            <span matTextPrefix>$</span>
            <input
              matInput
              type="number"
              formControlName="price"
              (change)="updateSubtotal()"
            />
          </mat-form-field>

          <mat-form-field class="item-discount narrow">
            <mat-label>Disc %</mat-label>
            <input
              matInput
              type="number"
              formControlName="discount"
              (change)="updateSubtotal()"
            />
          </mat-form-field>

          <button
            mat-icon-button
            color="warn"
            (click)="removeItem(i)"
            [disabled]="items.controls.length === 1"
            matTooltip="Remove Item"
          >
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
        }
      </div>

      <div class="actions-bar">
        <button
          mat-stroked-button
          color="primary"
          class="add-btn"
          (click)="addItem()"
        >
          <mat-icon>add_circle_outline</mat-icon> Add New Item
        </button>
      </div>
    </div>

    <!-- RIGHT PANEL: SUMMARY & CHECKOUT -->
    <div class="summary-panel glass-card">
      <div class="panel-header">
        <h2>🧾 Summary</h2>
      </div>

      <div class="summary-details">
        <div class="summary-row">
          <span>Subtotal</span>
          <span class="value">{{
            receiptForm.get("subtotal")?.value | currency
          }}</span>
        </div>

        <mat-divider></mat-divider>

        <div class="modifiers">
          <mat-form-field appearance="outline" class="modifier-input">
            <mat-label>Loyalty Disc.</mat-label>
            <span matTextPrefix>-$</span>
            <input matInput type="number" formControlName="loyaltyDiscount" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="modifier-input">
            <mat-label>GST Rate</mat-label>
            <span matTextSuffix>%</span>
            <input matInput type="number" formControlName="gstRate" />
          </mat-form-field>
        </div>

        <mat-divider></mat-divider>

        <div class="summary-row total">
          <span>Total To Pay</span>
          <!-- Note: A real app would calculate the final total. For now, showing subtotal as placeholder or we can implement real total logic later. Visual only here. -->
          <span class="value highlight">{{ calculateTotal() | currency }}</span>
        </div>

        <div class="payment-input">
          <mat-form-field class="full-width">
            <mat-label>Cash Received</mat-label>
            <span matTextPrefix>$</span>
            <input matInput type="number" formControlName="cash" />
          </mat-form-field>
        </div>
      </div>

      <div class="checkout-actions">
        <button
          mat-raised-button
          color="primary"
          class="generate-btn"
          [disabled]="receiptForm.invalid"
          (click)="generateReceipt()"
        >
          <mat-icon>print</mat-icon> Generate Receipt
        </button>
      </div>
    </div>
  </form>
</div>
